  <!-- Turmoil Redux — LEADERSHIP, printed (TR73 Political Alliance's MIN plate: «the leader on two resolutions»): TWO
       of the white delegate figures side by side — the badge of the hand's leadership counter («[two figures] 1/2»).
       The ONE silhouette (`delegate.svg`, DELEGATE_PATH byte for byte — guard `tests/parliament/DelegateGlyphParity.spec.ts`),
       drawn once and USED twice, so the pair can never become a second drawing of the delegate. -->
  <defs>
    <linearGradient id="delegate-pair-print" x1="0" y1="1.5" x2="0" y2="51.4" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#ecebe9"/>
      <stop offset="1" stop-color="#b9b8b6"/>
    </linearGradient>
    <g id="delegate-pair-figure">
