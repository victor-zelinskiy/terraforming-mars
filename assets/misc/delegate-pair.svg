            fill="url(#delegate-pair-print)" stroke="#141414" stroke-width="2.2" stroke-linejoin="round" paint-order="stroke"/>
      <ellipse cx="14.6" cy="8.4" rx="3.9" ry="2.8" transform="rotate(-28 14.6 8.4)" fill="#ffffff" opacity="0.7"/>
