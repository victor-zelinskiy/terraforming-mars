<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <!-- Turmoil Redux — INFLUENCE (the owner, 2026-10-24): the scans' STAR seal, but no delegate inside it — the bust
       made influence read as one more delegate. A ten-ray violet seal (its own colour: never the delegate's white or
       steel, never the Career's red insignia) holding the RINGS OF REACH — a gold core and two rings spreading from it,
       a voice carried outward. At chip size it stays a violet star with a gold eye. The colour lives in the file (the
       console strips every `filter`); one file for the card face, the requirement plate, the chips and the track. -->
  <defs>
    <radialGradient id="influence-seal" cx="38%" cy="32%" r="75%">
      <stop offset="0" stop-color="#8b6cf0"/>
      <stop offset="0.6" stop-color="#4a2fa8"/>
      <stop offset="1" stop-color="#24145c"/>
    </radialGradient>
    <linearGradient id="influence-gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff2b0"/>
      <stop offset="0.55" stop-color="#f0c64a"/>
      <stop offset="1" stop-color="#b98516"/>
    </linearGradient>
  </defs>
  <path d="M24.00 0.60L28.70 9.54L37.75 5.07L36.30 15.07L46.25 16.77L39.20 24.00L46.25 31.23L36.30 32.93L37.75 42.93L28.70 38.46L24.00 47.40L19.30 38.46L10.25 42.93L11.70 32.93L1.75 31.23L8.80 24.00L1.75 16.77L11.70 15.07L10.25 5.07L19.30 9.54Z" fill="url(#influence-seal)" stroke="#120a2e" stroke-width="1.4" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="12.4" fill="#170d3a" stroke="url(#influence-gold)" stroke-width="1.4"/>
  <circle cx="24" cy="24" r="9.2" fill="none" stroke="url(#influence-gold)" stroke-width="1.5" opacity="0.55"/>
  <circle cx="24" cy="24" r="6" fill="none" stroke="url(#influence-gold)" stroke-width="1.7" opacity="0.85"/>
  <circle cx="24" cy="24" r="3" fill="url(#influence-gold)"/>
</svg>
