<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- TR68 «a card with a requirement»: a small card carrying its own gold MIN plate (the scan's MIN-plate glyph). -->
  <defs>
    <linearGradient id="cr-card" x1="12" y1="2" x2="12" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f4ecd6"/>
      <stop offset="1" stop-color="#c9bd9c"/>
    </linearGradient>
    <linearGradient id="cr-plate" x1="0" y1="4" x2="0" y2="10" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffd86a"/>
      <stop offset="1" stop-color="#e09a12"/>
    </linearGradient>
  </defs>
  <!-- the card -->
  <rect x="4.2" y="1.6" width="15.6" height="20.8" rx="2" fill="url(#cr-card)" stroke="#5c4a22" stroke-width="1.1"/>
  <!-- its art window -->
  <rect x="6.4" y="11.2" width="11.2" height="6.4" rx="0.8" fill="#8f9fae" opacity="0.55"/>
  <!-- the gold MIN plate in its top-left corner -->
  <rect x="5.6" y="3.4" width="10.4" height="5.6" rx="1" fill="url(#cr-plate)" stroke="#6b4a08" stroke-width="0.9"/>
  <!-- the plate's bars: the printed «requirement» mark -->
  <rect x="7.2" y="5.1" width="1.2" height="2.2" fill="#3b2a06"/>
  <rect x="9.4" y="5.6" width="5" height="1.3" rx="0.4" fill="#3b2a06" opacity="0.8"/>
</svg>
