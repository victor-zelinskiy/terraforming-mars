<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- UNITY — three LINKED RINGS: the motif the party is known by, drawn in
       the family's badge language (navy disc, gold rim, a luminous sigil).
       Its own character is BLUE: a cool sky-to-cobalt tube with a bright
       inner highlight, thick enough to read at 40px. The rings weave over
       and under one another (each crossing is a real over/under, drawn as
       clipped arc segments), so the three read as one linked body. -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1d2a4d"/>
      <stop offset="60%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1d98a"/>
      <stop offset="50%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#e9cf7c"/>
    </linearGradient>
    <linearGradient id="tube" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dcefff"/>
      <stop offset="55%" stop-color="#8fbaff"/>
      <stop offset="100%" stop-color="#5b8ef2"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.66  0 0 0 0 1  0 0 0 0.85 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- the three ring centres (an equilateral triad) -->
    <circle id="rA" cx="256" cy="186" r="98"/>
    <circle id="rB" cx="196" cy="290" r="98"/>
    <circle id="rC" cx="316" cy="290" r="98"/>
    <!-- each ring's OVER-segment window: the half of the ring that crosses
         the next ring on top (clip regions are generous half-planes) -->
    <clipPath id="cA"><rect x="0" y="0" width="256" height="512"/></clipPath>
    <clipPath id="cB"><rect x="0" y="256" width="512" height="256"/></clipPath>
    <clipPath id="cC"><rect x="256" y="0" width="256" height="512"/></clipPath>
  </defs>
  <circle cx="256" cy="256" r="244" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
  <g filter="url(#glow)" fill="none" stroke-linecap="round">
    <!-- base pass: every ring fully drawn (outline → tube → highlight) -->
    <g stroke="#0b1430" stroke-width="34" stroke-opacity="0.9">
      <use href="#rA"/><use href="#rB"/><use href="#rC"/>
    </g>
    <g stroke="url(#tube)" stroke-width="22">
      <use href="#rA"/><use href="#rB"/><use href="#rC"/>
    </g>
    <g stroke="#ffffff" stroke-width="5" stroke-opacity="0.55">
      <circle cx="256" cy="186" r="105"/>
      <circle cx="196" cy="290" r="105"/>
      <circle cx="316" cy="290" r="105"/>
    </g>
    <!-- weave pass: each ring's OVER half is redrawn on top of its neighbours,
         so every crossing reads as a real link, not a flat overlap -->
    <g clip-path="url(#cA)">
      <use href="#rA" stroke="#0b1430" stroke-width="34" stroke-opacity="0.9"/>
      <use href="#rA" stroke="url(#tube)" stroke-width="22"/>
      <circle cx="256" cy="186" r="105" stroke="#ffffff" stroke-width="5" stroke-opacity="0.55"/>
    </g>
    <g clip-path="url(#cB)">
      <use href="#rB" stroke="#0b1430" stroke-width="34" stroke-opacity="0.9"/>
      <use href="#rB" stroke="url(#tube)" stroke-width="22"/>
      <circle cx="196" cy="290" r="105" stroke="#ffffff" stroke-width="5" stroke-opacity="0.55"/>
    </g>
    <g clip-path="url(#cC)">
      <use href="#rC" stroke="#0b1430" stroke-width="34" stroke-opacity="0.9"/>
      <use href="#rC" stroke="url(#tube)" stroke-width="22"/>
      <circle cx="316" cy="290" r="105" stroke="#ffffff" stroke-width="5" stroke-opacity="0.55"/>
    </g>
  </g>
</svg>
