<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- UNITY — three hands joined: a triad of solid arcs meeting in a shared core.
       The same badge language as the five other seals (navy disc, gold rim,
       a luminous sigil), a silhouette of its own: solid crescents + a core,
       never thin interlocked rings. -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1d2a4d"/>
      <stop offset="60%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1d98a"/>
      <stop offset="50%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#e9cf7c"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#cfe0ff"/>
      <stop offset="100%" stop-color="#6f9cff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.45  0 0 0 0 0.62  0 0 0 0 1  0 0 0 0.9 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="244" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
  <g filter="url(#glow)" fill="url(#sig)">
    <!-- three crescents, 120° apart, each reaching toward the core -->
    <g transform="translate(256 256)">
      <g>
        <path d="M0 -150 A150 150 0 0 1 130 -75 L96 -55 A110 110 0 0 0 0 -110 Z"/>
        <path transform="rotate(120)" d="M0 -150 A150 150 0 0 1 130 -75 L96 -55 A110 110 0 0 0 0 -110 Z"/>
        <path transform="rotate(240)" d="M0 -150 A150 150 0 0 1 130 -75 L96 -55 A110 110 0 0 0 0 -110 Z"/>
      </g>
      <!-- the spokes joining the crescents to the shared core -->
      <path d="M-14 -108 L14 -108 L10 -40 L-10 -40 Z"/>
      <path transform="rotate(120)" d="M-14 -108 L14 -108 L10 -40 L-10 -40 Z"/>
      <path transform="rotate(240)" d="M-14 -108 L14 -108 L10 -40 L-10 -40 Z"/>
      <!-- the core -->
      <circle cx="0" cy="0" r="44"/>
      <circle cx="0" cy="0" r="22" fill="#0f1730"/>
    </g>
  </g>
</svg>
