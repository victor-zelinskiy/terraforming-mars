<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SCIENTISTS — a molecule: a hexagonal bond ring with atoms at its
       vertices and a bright nucleus. The badge language of the family (navy
       disc, gold rim, a luminous sigil); the silhouette is a HEXAGON of nodes —
       nothing like the Unity triad or an atom's ellipses. -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1d2a4d"/>
      <stop offset="60%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1d98a"/>
      <stop offset="50%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#e9cf7c"/>
    </linearGradient>
    <linearGradient id="sig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#c3ccdc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.85  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.85 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="244" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
  <g filter="url(#glow)" transform="translate(256 256)">
    <!-- the bond ring (a hexagon) and the three inner double-bond strokes -->
    <polygon points="0,-138 120,-69 120,69 0,138 -120,69 -120,-69" fill="none" stroke="url(#sig)" stroke-width="16" stroke-linejoin="round"/>
    <polygon points="0,-104 90,-52 90,52 0,104 -90,52 -90,-52" fill="none" stroke="url(#sig)" stroke-width="6" stroke-opacity="0.55" stroke-linejoin="round"/>
    <!-- the atoms on the vertices -->
    <g fill="url(#sig)">
      <circle cx="0" cy="-138" r="26"/>
      <circle cx="120" cy="-69" r="26"/>
      <circle cx="120" cy="69" r="26"/>
      <circle cx="0" cy="138" r="26"/>
      <circle cx="-120" cy="69" r="26"/>
      <circle cx="-120" cy="-69" r="26"/>
    </g>
    <!-- the nucleus with a bright core -->
    <circle cx="0" cy="0" r="40" fill="url(#sig)"/>
    <circle cx="0" cy="0" r="18" fill="#0f1730"/>
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>
  </g>
</svg>
