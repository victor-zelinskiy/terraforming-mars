<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- SCIENTISTS — the ATOM: three electron orbits around a bright nucleus,
       the symbol the party is known by, in the family's badge language (navy
       disc, gold rim, a luminous sigil). Its own character is SILVER: cool
       platinum orbits with a white core — distinct in tone and line from the
       Unity's blue rings, and readable at 40px by its silhouette alone. -->
  <defs>
    <radialGradient id="disc" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#1d2a4d"/>
      <stop offset="60%" stop-color="#121a33"/>
      <stop offset="100%" stop-color="#0a0e1c"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1d98a"/>
      <stop offset="50%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#e9cf7c"/>
    </linearGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d9dfe9"/>
      <stop offset="100%" stop-color="#9aa6b8"/>
    </linearGradient>
    <radialGradient id="core" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="55%" stop-color="#dfe6f0"/>
      <stop offset="100%" stop-color="#8d9bb0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feColorMatrix in="b" type="matrix" values="0 0 0 0 0.86  0 0 0 0 0.9  0 0 0 0 1  0 0 0 0.8 0" result="c"/>
      <feMerge><feMergeNode in="c"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="256" cy="256" r="244" fill="url(#disc)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rim)" stroke-width="7"/>
  <circle cx="256" cy="256" r="222" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
  <g filter="url(#glow)" transform="translate(256 256)" fill="none" stroke-linecap="round">
    <!-- the three orbits: a dark outline under a platinum tube, a white glint on top -->
    <g stroke="#0b1430" stroke-width="26" stroke-opacity="0.85">
      <ellipse rx="158" ry="58"/>
      <ellipse rx="158" ry="58" transform="rotate(60)"/>
      <ellipse rx="158" ry="58" transform="rotate(120)"/>
    </g>
    <g stroke="url(#orbit)" stroke-width="15">
      <ellipse rx="158" ry="58"/>
      <ellipse rx="158" ry="58" transform="rotate(60)"/>
      <ellipse rx="158" ry="58" transform="rotate(120)"/>
    </g>
    <g stroke="#ffffff" stroke-width="3.5" stroke-opacity="0.5">
      <ellipse rx="163" ry="63"/>
      <ellipse rx="163" ry="63" transform="rotate(60)"/>
      <ellipse rx="163" ry="63" transform="rotate(120)"/>
    </g>
    <!-- three electrons on their orbits -->
    <g fill="#ffffff">
      <circle cx="158" cy="0" r="11"/>
      <circle cx="-79" cy="-136.8" r="11"/>
      <circle cx="-79" cy="136.8" r="11"/>
    </g>
    <!-- the nucleus -->
    <circle r="40" fill="#0b1430" fill-opacity="0.85"/>
    <circle r="32" fill="url(#core)"/>
  </g>
</svg>
