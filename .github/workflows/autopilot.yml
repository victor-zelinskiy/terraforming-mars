name: Autopilot

# WHOLE GAMES THROUGH THE REAL CONSOLE (docs/claude/console/freeze-zero/PLAN.md § 8, stage 6): the bottle — the real
# shell against the real server in one process on a manual clock — plays a table from its first press to the final
# scoring (tests/client/bottle/autopilot.ts). Each game is a table the engine fuzz draws from its number (every
# in-scope expansion, MarsBot in three games of four, one to three humans, every board); the viewer's seat is played
# through the console, the other seats by random legal answers. No browser, no box: a game is a function of its
# number, so whatever a run names replays on a laptop —
#   TM_BOTTLE_AUTOPILOT=1 TM_BOTTLE_AUTOPILOT_SEEDS=<n> npm run test:client:one -- tests/client/bottle/autopilot.bottle.ts
#
# …AND THE SAME PILOT IN A REAL BROWSER (tests/e2e/console-autopilot.spec.ts — `where: browser | both`): the real page in
# real time, the solo player against MarsBot from the first press to the final scoring. The bottle is minutes and is
# blind wherever a rect or a CSS clock is needed; the browser is ten to twenty minutes a game and sees everything.
#
# THE PASS IS ONE VERDICT (the `report` job): the games of each world summed as the monkey's passes are and held as a
# GATE — no game STUCK, no rebuild, no episode never cured, the one-owner and the beat laws at zero, and no cause
# class its baseline does not hold (tests/client/bottle/autopilotBaseline.json — what the bottle cannot see, each row
# with why; tests/e2e/autopilotBaseline.json — the real browser's, which holds none). What it finds is filed into the
# one queue (scripts/ci/findings.mjs, source `autopilot`). BY HAND for now (no schedule): a pass is hours of runners.
on:
  workflow_dispatch:
    inputs:
      from:
        description: 'The first game (its number is its seed)'
        required: false
        default: '1'
      games:
        description: 'How many games'
        required: false
        default: '24'
      shards:
        description: 'Parallel jobs (a game is 5 – 15 minutes of one runner)'
        required: false
        default: '8'
      name:
        description: 'The pass''s name — the stream of presses is <name>:<n> (another name = other presses on the same tables)'
        required: false
        default: 'ap0'
      deal:
        description: 'rotate (the scope in turn) · missing (the cards no game has played yet first — tests/client/bottle/autopilotCardsUnplayed.json) · random'
        required: false
        type: choice
        options: [rotate, missing, random]
        default: rotate
      where:
        description: 'bottle (the manual clock, minutes) · browser (a real Chromium, real time) · both'
        required: false
        type: choice
        options: [both, bottle, browser]
        default: both

permissions:
  contents: read

concurrency:
  group: autopilot-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Shards
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
    steps:
      - id: m
        env:
          FROM: ${{ inputs.from }}
          GAMES: ${{ inputs.games }}
          SHARDS: ${{ inputs.shards }}
        run: |
          # Game numbers dealt round-robin: shard k plays FROM+k, FROM+k+SHARDS, … — as comma lists the spec takes.
          node -e '
            const from = Number(process.env.FROM), games = Number(process.env.GAMES), shards = Math.max(1, Math.min(Number(process.env.SHARDS), games));
            if (![from, games, shards].every(Number.isInteger) || games < 1 || games > 400) { console.error("bad inputs"); process.exit(1); }
            const lists = Array.from({length: shards}, (_, k) => Array.from({length: games}, (_, i) => from + i).filter((_, i) => i % shards === k).join(","));
            console.log("shards=" + JSON.stringify(lists));
          ' >> "$GITHUB_OUTPUT"

  play:
    name: Bottle · games ${{ matrix.seeds }}
    needs: plan
    if: ${{ inputs.where != 'browser' }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        seeds: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run make:static
      # The client's generated files the bottle bundles (card renders, the art manifest) — what `npm run build` makes first.
      - run: npm run make:cards
      - name: Whole games (${{ matrix.seeds }})
        env:
          TM_BOTTLE_AUTOPILOT: '1'
          TM_BOTTLE_AUTOPILOT_SEEDS: ${{ matrix.seeds }}
          TM_BOTTLE_AUTOPILOT_NAME: ${{ inputs.name }}
          TM_BOTTLE_AUTOPILOT_DEAL: ${{ inputs.deal || 'rotate' }}
          NODE_ENV: development
          NODE_OPTIONS: --max-old-space-size=6144
        run: node scripts/client-tests.mts tests/client/bottle/autopilot.bottle.ts 2>&1 | tee autopilot.log | grep -E '· game |passing|failing|HARNESS' || true
      # The pass summed as the monkey's passes are: by cause class, the one-owner law, the beat law, the coverage.
      - name: The report
        if: ${{ !cancelled() }}
        run: node scripts/monkey-report.mjs .e2e-remote/bottle-autopilot --out autopilot-report.json | tee autopilot-report.txt | head -60
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: autopilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: |
            .e2e-remote/bottle-autopilot/cause-classes
            autopilot-report.json
            autopilot-report.txt
            autopilot.log
          if-no-files-found: warn
          retention-days: 14

  browser:
    name: Browser · games ${{ matrix.seeds }}
    needs: plan
    if: ${{ inputs.where != 'bottle' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        seeds: ${{ fromJSON(needs.plan.outputs.shards) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install failed (attempt $attempt) — retrying in 60 s"
            sleep 60
            sudo apt-get update || true
          done
          exit 1
      # A game that names a class still PASSES (the class is filed — the report is read); what fails a game is the
      # harness's own guards (a stall nobody cured, a Vue error, a page that died) and a table nobody moves.
      - name: Whole games in a real browser (${{ matrix.seeds }})
        env:
          TM_E2E_AUTOPILOT: '1'
          TM_E2E_AUTOPILOT_GAMES: ${{ matrix.seeds }}
          TM_E2E_AUTOPILOT_NAME: ${{ inputs.name }}
          TM_E2E_AUTOPILOT_DEAL: ${{ inputs.deal || 'rotate' }}
          TM_E2E_COVERAGE: '1'
        run: npx playwright test tests/e2e/console-autopilot.spec.ts --project=chromium --workers=1 --retries=0 --reporter=list,github
      - name: The report
        if: ${{ !cancelled() }}
        run: node scripts/monkey-report.mjs test-results --out autopilot-browser-report.json | tee autopilot-browser-report.txt | head -60
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: autopilot-browser-${{ github.run_id }}-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: |
            test-results/cause-classes
            test-results/**/autopilot-walk.txt
            test-results/**/*.png
            test-results/**/error-context.md
            autopilot-browser-report.json
            autopilot-browser-report.txt
          if-no-files-found: warn
          retention-days: 14

  # THE PASS, AS ONE VERDICT (stage 6's number: N whole games, every one to its final scoring or to the pilot's own
  # cap, no game STUCK, no rebuild, no episode never cured, no cause class its baseline does not hold, the one-owner
  # and the beat laws at zero) — per world, each against its own baseline: the bottle's holds what the bottle cannot
  # see (a class is written there only after the same games in a real browser did not name it), the browser's holds
  # nothing.
  report:
    name: Report · ${{ inputs.name }} · games ${{ inputs.from }}+${{ inputs.games }}
    needs: [plan, play, browser]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download the bottle's games
        uses: actions/download-artifact@v5
        with:
          pattern: autopilot-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: bottle-results
      - name: Download the browser's games
        uses: actions/download-artifact@v5
        with:
          pattern: autopilot-browser-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: browser-results
      - name: The bottle's games, as a gate
        id: bottle
        if: ${{ inputs.where != 'browser' }}
        run: |
          # (--expect: THE DENOMINATOR — a shard that died, a game whose harness threw or a file cut short is a pass that
          #  is not whole, never a pass that passed: stage M of docs/claude/console/freeze-zero/PLAN.md § 8.)
          node scripts/monkey-report.mjs bottle-results --against tests/client/bottle/autopilotBaseline.json --out autopilot-bottle.json --gate --expect "${{ inputs.games }}" | tee autopilot-bottle.txt
          exit ${PIPESTATUS[0]}
      - name: The browser's games, as a gate
        id: browser
        if: ${{ !cancelled() && inputs.where != 'bottle' }}
        run: |
          node scripts/monkey-report.mjs browser-results --against tests/e2e/autopilotBaseline.json --out autopilot-browser.json --gate --expect "${{ inputs.games }}" | tee autopilot-browser.txt
          exit ${PIPESTATUS[0]}
      # THE ZERO BAR IS THE REAL PAGE's VERDICT (the owner, 2026-11-25: «0 % ошибок, зависаний и даже ворнингов … на
      # ЛЮБЫХ запусках автопилота»; stage M — the bar was a flag no workflow passed, and no run ever said how far from
      # it a pass stood). A step of its own beside the gate: the gate says «no defect of the hard kind», this says
      # «nothing at all» — a record of any tier, an answer through the door, a line of the page's log. In the bottle
      # the bar is printed, not yet a failure: its debt is the blind list (jsdom has no layout), paid row by row.
      - name: The browser's games against THE ZERO BAR
        if: ${{ !cancelled() && inputs.where != 'bottle' }}
        run: |
          node --input-type=module -e '
            import * as fs from "node:fs";
            const zero = JSON.parse(fs.readFileSync("autopilot-browser.json", "utf8")).verdicts?.zero;
            if (zero === undefined) { console.error("the report carries no verdict"); process.exit(1); }
            console.log(zero.pass ? "THE ZERO BAR: pass" : "THE ZERO BAR: FAIL");
            for (const reason of zero.pass ? [] : zero.reasons) { console.log("  · " + reason); }
            process.exit(zero.pass ? 0 : 1);
          '
      # WHAT THE PASS FOUND, in the one shape every workflow speaks — and filed: one issue per cause class.
      - name: Findings
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: ${{ inputs.name }} · games ${{ inputs.from }}+${{ inputs.games }}
        run: |
          for world in bottle browser; do
            [ -f "autopilot-$world.json" ] || continue
            RED=""
            if [ "$world" = bottle ] && { [ "${{ steps.bottle.outcome }}" != "success" ] || [ "${{ needs.play.result }}" != "success" ]; }; then RED="--gate-red"; fi
            if [ "$world" = browser ] && { [ "${{ steps.browser.outcome }}" != "success" ] || [ "${{ needs.browser.result }}" != "success" ]; }; then RED="--gate-red"; fi
            node scripts/ci/findings.mjs from-monkey "autopilot-$world.json" --source autopilot --context "$world · $CONTEXT" $RED \
              --repro "gh workflow run Autopilot -f from=<game> -f games=1 -f name=${{ inputs.name }} -f where=$world   # the bottle on a laptop: TM_BOTTLE_AUTOPILOT=1 TM_BOTTLE_AUTOPILOT_SEEDS=<game> TM_BOTTLE_AUTOPILOT_DEBUG=1 NODE_ENV=development node scripts/client-tests.mts tests/client/bottle/autopilot.bottle.ts" \
              --out "ci-findings-$world.json"
            node scripts/ci/findings.mjs file "ci-findings-$world.json"
          done
      - name: Summary
        if: always()
        run: |
          {
            echo '### Autopilot · `${{ inputs.name }}` · games ${{ inputs.from }}+${{ inputs.games }}'
            for world in bottle browser; do
              [ -f "autopilot-$world.txt" ] || continue
              echo "#### $world"
              echo '```'
              head -n 3 "autopilot-$world.txt"
              grep -A 8 'THE WHOLE GAMES' "autopilot-$world.txt" || true
              grep -A 12 'against the earlier run' "autopilot-$world.txt" || true
              grep 'GATE:' "autopilot-$world.txt" || true
              grep 'THE ZERO BAR:' "autopilot-$world.txt" | cut -c1-1600 || true
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: autopilot-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            autopilot-bottle.json
            autopilot-bottle.txt
            autopilot-browser.json
            autopilot-browser.txt
            ci-findings-bottle.json
            ci-findings-browser.json
          if-no-files-found: warn
          retention-days: 30
