name: Playwright E2E

on:
  workflow_dispatch:
    inputs:
      shards:
        description: 'How many parallel shards to split the suite across (tests/e2e/shardPlan.json is balanced for 4, 6, 8, 10, 12, 16 and 20; ~370 box-minutes of serial test time in all — 12 keeps a CI shard near an hour)'
        required: false
        default: '12'
      grep:
        description: 'Only run tests whose title matches this (Playwright --grep)'
        required: false
        default: ''
      burnin_depth:
        description: 'Burn-in: run e2e specs touched in the last N commits with --repeat-each=3 (0 = skip)'
        required: false
        default: '15'

permissions:
  contents: read

jobs:
  # ── THE SHARD MATRIX, from the `shards` input ─────────────────────────────
  # The suite doubled in a month (≈ 200 → 378 spec files): four shards of one
  # worker each put a shard near its 120-minute cap. The count is an INPUT now
  # (default 8), and shardPlan.json carries a time-balanced plan per count, so
  # changing it on the day needs no regeneration.
  plan:
    name: Shard matrix
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
      list: ${{ steps.m.outputs.list }}
    steps:
      - id: m
        run: |
          N='${{ inputs.shards || '12' }}'
          case "$N" in ''|*[!0-9]*) echo "shards must be a positive integer, got '$N'"; exit 1;; esac
          echo "shards=$N" >> "$GITHUB_OUTPUT"
          echo "list=[$(seq -s, 1 "$N")]" >> "$GITHUB_OUTPUT"

  # ── ONE SHARD OF THE SUITE ────────────────────────────────────────────────
  # The suite is split across independent runners rather than given more workers
  # on one. Each spec creates its OWN game over the API and drives its OWN page,
  # and each shard boots its OWN app + server, so a shard shares no state with
  # any other — the isolation is by construction, not by convention. Inside a
  # shard the worker count stays 1: several concurrent Chromium instances (some
  # rendering a 3840x2160 console profile) starve each other's first paint, and
  # those failures are indistinguishable from product bugs in the report (see the
  # note in playwright.config.ts).
  e2e:
    name: E2E shard ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 150

    strategy:
      # One shard failing must never cancel the others — the whole point is to
      # learn the state of the WHOLE suite in one run.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright's webServer starts the compiled application with `npm start`.
      - name: Build application
        run: npm run build

      # The browser download is the same for every shard of a run (and across runs until the lock moves): cached
      # by the lock's hash, `install --with-deps` then only checks it and installs the OS packages.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Compile the test tree
        run: npm run build:test

      # WHAT EXACTLY RAN. A report that cannot be tied back to a commit, a
      # browser build and a concrete command is a report you have to re-run to
      # trust. This lands next to the traces in the artifact.
      - name: Record run parameters
        run: |
          mkdir -p test-results
          {
            echo "commit:        ${{ github.sha }}"
            echo "ref:           ${{ github.ref }}"
            echo "run:           ${{ github.run_id }} attempt ${{ github.run_attempt }}"
            echo "shard:         ${{ matrix.shard }}/${{ needs.plan.outputs.shards }}"
            echo "grep:          ${{ inputs.grep }}"
            echo "node:          $(node --version)"
            echo "playwright:    $(npx playwright --version)"
            echo "command:       npx playwright test tests/e2e --shard=${{ matrix.shard }}/${{ needs.plan.outputs.shards }} --workers=1"
            echo "config:        workers=1 retries=2 trace=on-first-retry(no-screencast) video=off screenshot=only-on-failure"
          } | tee test-results/run-params.txt

      # `blob` is what makes the shards mergeable into ONE report; `list` keeps
      # the live log readable; `github` turns each failure into a file
      # annotation on the run summary.
      #
      # Artifact size policy (the merged HTML report hit 7 GB, then still 2 GB):
      # the whole trace/video/screenshot policy lives in playwright.config.ts
      # behind isCI — one trace per deterministic failure (on-first-retry, so a
      # flake that passes on retry keeps nothing), video off, screenshots
      # only-on-failure, and NO screencast film strip inside CI traces (it was
      # 106 of 140 MB per trace: ~23 fps of jpeg frames; the DOM snapshots that
      # remain still give a Before/After image per action).
      #
      # DO NOT pass --trace on this command line: the CLI value replaces the
      # config's trace OBJECT with a bare mode string, which silently turns the
      # film strip back on. A green test writes nothing heavy.
      # TIME-BALANCED SHARDS (phase 3): when tests/e2e/shardPlan.json matches
      # the shard count, each runner takes its measured-minutes bucket (new
      # specs are round-robined in by the script, deleted ones skipped);
      # otherwise the positional --shard fallback keeps the run whole.
      - name: Run Playwright E2E (shard ${{ matrix.shard }})
        run: |
          if FILES=$(node scripts/e2e-shard-files.mjs ${{ matrix.shard }} ${{ needs.plan.outputs.shards }}); then
            echo "time-balanced bucket: $FILES"
            npx playwright test $FILES --workers=1 --reporter=list,github,blob ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
          else
            npx playwright test tests/e2e --shard=${{ matrix.shard }}/${{ needs.plan.outputs.shards }} --workers=1 --reporter=list,github,blob ${{ inputs.grep && format('--grep "{0}"', inputs.grep) || '' }}
          fi

      # Blobs exist only to be merged by the report job minutes later — they
      # carry every trace, so a long retention just stores the merged report's
      # content twice.
      - name: Upload blob report (for merging)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: blob-report-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 3

      # The diagnostics a failure actually needs, named so the shard is obvious
      # without opening it. Traces are EXCLUDED here on purpose: they already
      # travel inside the blob report and land in the merged HTML report —
      # uploading them again doubled the run's storage.
      - name: Upload shard diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: |
            test-results/
            !test-results/**/trace.zip
            screenshots/
          if-no-files-found: ignore
          retention-days: 14

  # ── ONE REPORT FOR THE WHOLE RUN ──────────────────────────────────────────
  # Merging the blobs is what keeps the shard split from costing legibility:
  # deterministic failures, flaky-after-retry and «did not run» all keep their
  # own status in a single HTML report instead of being spread over four logs.
  report:
    name: Merged HTML report
    if: ${{ !cancelled() }}
    needs: [e2e]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all blob reports
        uses: actions/download-artifact@v5
        with:
          pattern: blob-report-${{ github.run_id }}-${{ github.run_attempt }}-shard*
          path: all-blobs
          merge-multiple: true

      - name: Merge into one HTML report
        run: npx playwright merge-reports --reporter=html,list ./all-blobs

      # ── THE FLAKE LEDGER (docs/E2E_ARCHITECTURE_REWORK.md phase 0). ──
      # `retries=2` rescues a flaky test into a green run; the ledger is what
      # keeps each rescue COUNTED. The ledger file rides the actions cache
      # (newest key wins via the restore prefix), keeps the last 50 runs, and
      # the script exits 1 when the same test flaked ≥3 times in the last 20
      # runs — a red report job that names the spec to fix or quarantine.
      - name: Restore flake ledger
        uses: actions/cache/restore@v4
        with:
          path: e2e-flake-ledger.json
          key: e2e-flake-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            e2e-flake-ledger-

      # ── THE FIX BRIEF: every failed / flaky test with its error, location, code frame, stdout tail and seed, as ONE
      # copyable block on this run's summary page — what a fix needs, without downloading the HTML report. Runs
      # BEFORE the ledger (which may exit 1 on a repeat offender) and never fails the job itself.
      - name: Merge JSON report
        run: npx playwright merge-reports --reporter=json ./all-blobs > merged-report.json

      - name: Fix brief (copyable, on the summary page)
        if: ${{ !cancelled() }}
        run: node scripts/e2e-fix-brief.mjs merged-report.json --run "${{ github.run_id }}.${{ github.run_attempt }}" --commit "${{ github.sha }}"

      - name: Update flake ledger
        run: node scripts/e2e-flake-ledger.mjs merged-report.json --run-id "${{ github.run_id }}.${{ github.run_attempt }}"

      - name: Save flake ledger
        if: ${{ !cancelled() }}
        uses: actions/cache/save@v4
        with:
          path: e2e-flake-ledger.json
          key: e2e-flake-ledger-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload flake ledger
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: e2e-flake-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: e2e-flake-ledger.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload merged report
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  # ── BURN-IN: recently-touched specs are run REPEATEDLY, so a new flake is
  # caught at birth instead of in next month's report (phase 0 of
  # docs/E2E_ARCHITECTURE_REWORK.md). Runs beside the shards; specs touched in
  # the last `burnin_depth` commits get --repeat-each=3 (capped at 15 files so
  # a refactor day cannot triple the whole suite).
  burn-in:
    name: Burn-in changed specs (×3)
    if: ${{ inputs.burnin_depth != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Compute changed specs
        id: changed
        run: |
          DEPTH='${{ inputs.burnin_depth }}'
          SPECS=$(git diff --name-only "HEAD~${DEPTH}" -- tests/e2e 2>/dev/null | grep '\.spec\.ts$' | head -15 | tr '\n' ' ' || true)
          echo "specs=${SPECS}" >> "$GITHUB_OUTPUT"
          if [ -z "${SPECS// /}" ]; then
            echo "No e2e specs changed in the last ${DEPTH} commits — burn-in skipped."
          else
            echo "Burn-in set: ${SPECS}"
          fi

      - name: Setup Node
        if: ${{ steps.changed.outputs.specs != '' }}
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: ${{ steps.changed.outputs.specs != '' }}
        run: npm ci

      - name: Build application
        if: ${{ steps.changed.outputs.specs != '' }}
        run: npm run build

      - name: Cache Playwright browsers
        if: ${{ steps.changed.outputs.specs != '' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        if: ${{ steps.changed.outputs.specs != '' }}
        run: npx playwright install --with-deps chromium

      - name: Compile the test tree
        if: ${{ steps.changed.outputs.specs != '' }}
        run: npm run build:test

      - name: Run changed specs ×3
        if: ${{ steps.changed.outputs.specs != '' }}
        run: >
          npx playwright test ${{ steps.changed.outputs.specs }}
          --repeat-each=3
          --workers=1
          --reporter=list,github

      - name: Upload burn-in diagnostics
        if: ${{ !cancelled() && steps.changed.outputs.specs != '' }}
        uses: actions/upload-artifact@v5
        with:
          name: burnin-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            test-results/
            !test-results/**/trace.zip
          if-no-files-found: ignore
          retention-days: 7
