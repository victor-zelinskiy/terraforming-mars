name: Monkey

# THE MONKEY ON CI (docs/claude/console/freeze-zero/PLAN.md § 3, § 8): a seeded random walk of the pad over EVERY
# table in a real browser (tests/e2e/console-monkey.spec.ts), each walk ending in an untouched spell so the screen it
# leaves is judged — and the whole run summed by cause class (scripts/monkey-report.mjs) against
# tests/e2e/monkeyBaseline.json. Red = an episode that was never cured, or a DEFECT class the baseline does not hold.
#
# This is the pass the Steam Machine used to make overnight (3 h of the box per pass): on CI it is a matrix of
# shards side by side, and the box is left for pointwise runs. A perturbation (`perturb`) is one more pass — a race a
# quiet machine never loses must be given a machine that loses it.
#
# NIGHTLY (docs/claude/ci-findings.md): a plain pass with THE SEED OF THE DAY; on Sunday the perturbations, one pass
# each. A scheduled run takes at most 8 runners at a time — the release of a push must never queue behind it. What a
# run finds is FILED, one issue per cause class (scripts/ci/findings.mjs).
on:
  schedule:
    - cron: '0 3 * * *'    # every night — plain, the seed of the day
    - cron: '0 7 * * 0'    # Sunday — cpu4
    - cron: '0 10 * * 0'   # Sunday — net400
    - cron: '0 13 * * 0'   # Sunday — reload
    - cron: '0 16 * * 0'   # Sunday — duo
  workflow_dispatch:
    inputs:
      seed:
        description: 'The walk''s seed — the same seed is the same walk (fz0 is the baseline''s; a NEW seed is another 606 walks)'
        required: false
        default: 'fz0'
      perturb:
        description: 'Perturbation: none · cpu4 · cpu6 (CPU throttle) · net400 · net1500 (a delay on every answer, ms) · reload (the page reloaded at random presses) · duo (the second human seat walks its own page)'
        required: false
        default: 'none'
        type: choice
        options: [none, cpu4, cpu6, net400, net1500, reload, duo]
      shards:
        description: 'How many shards'
        required: false
        default: '16'
      only:
        description: 'Only tables whose name matches this regex (a slice)'
        required: false
        default: ''
      presses:
        description: 'Presses a walk'
        required: false
        default: '60'

permissions:
  contents: read

# Never in a group with the release or with CI: a pass can queue behind them, it can never cancel them.
concurrency:
  group: monkey-${{ github.event_name }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.m.outputs.shards }}
      list: ${{ steps.m.outputs.list }}
      seed: ${{ steps.m.outputs.seed }}
      perturb: ${{ steps.m.outputs.perturb }}
      parallel: ${{ steps.m.outputs.parallel }}
    steps:
      - id: m
        env:
          CRON: ${{ github.event.schedule }}
          SEED: ${{ inputs.seed }}
          PERTURB: ${{ inputs.perturb }}
        run: |
          N='${{ inputs.shards || '16' }}'
          case "$N" in ''|*[!0-9]*) echo "shards must be a positive integer, got '$N'"; exit 1;; esac
          PARALLEL="$N"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            # A scheduled pass leaves the runners to the day's pushes: half of its shards at a time.
            PARALLEL=8
            case "$CRON" in
              '0 7 * * 0') PERTURB=cpu4; SEED=fz0;;
              '0 10 * * 0') PERTURB=net400; SEED=fz0;;
              '0 13 * * 0') PERTURB=reload; SEED=fz0;;
              '0 16 * * 0') PERTURB=duo; SEED=fz0;;
              *) PERTURB=none; SEED="d$(date -u +%Y%m%d)";;
            esac
          fi
          echo "shards=$N" >> "$GITHUB_OUTPUT"
          echo "list=[$(seq -s, 1 "$N")]" >> "$GITHUB_OUTPUT"
          echo "seed=${SEED:-fz0}" >> "$GITHUB_OUTPUT"
          echo "perturb=${PERTURB:-none}" >> "$GITHUB_OUTPUT"
          echo "parallel=$PARALLEL" >> "$GITHUB_OUTPUT"

  walk:
    name: Walk ${{ matrix.shard }}/${{ needs.plan.outputs.shards }} · ${{ needs.plan.outputs.seed }} · ${{ needs.plan.outputs.perturb }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.parallel) }}
      matrix:
        shard: ${{ fromJSON(needs.plan.outputs.list) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build application
        run: npm run build
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install Chromium
        run: |
          for attempt in 1 2 3; do
            npx playwright install --with-deps chromium && exit 0
            echo "::warning::playwright install failed (attempt $attempt) — retrying in 60 s"
            sleep 60
            sudo apt-get update || true
          done
          exit 1
      # A walk that names a class still PASSES (the class is filed in test-results/cause-classes — the report is the
      # judge); what fails a walk is the harness's own guards (a stall nobody cured, a Vue error, a page that died).
      - name: The monkey (shard ${{ matrix.shard }})
        env:
          TM_E2E_MONKEY: '1'
          TM_E2E_MONKEY_SEED: ${{ needs.plan.outputs.seed }}
          TM_E2E_MONKEY_PRESSES: ${{ inputs.presses || '60' }}
          TM_E2E_MONKEY_ONLY: ${{ inputs.only }}
          TM_E2E_COVERAGE: '1'
          PERTURB: ${{ needs.plan.outputs.perturb }}
        run: |
          case "$PERTURB" in
            cpu4) export TM_E2E_CPU_THROTTLE=4;;
            cpu6) export TM_E2E_CPU_THROTTLE=6;;
            net400) export TM_E2E_MONKEY_NET_MS=400;;
            net1500) export TM_E2E_MONKEY_NET_MS=1500;;
            reload) export TM_E2E_MONKEY_RELOAD=1;;
            duo) export TM_E2E_MONKEY_DUO=1;;
          esac
          if [ -z "$TM_E2E_MONKEY_ONLY" ]; then unset TM_E2E_MONKEY_ONLY; fi
          npx playwright test tests/e2e/console-monkey.spec.ts --project=chromium --workers=1 --retries=0 \
            --shard=${{ matrix.shard }}/${{ needs.plan.outputs.shards }} --reporter=list,github
      # What the report sums (every walk's cause file) and what a red is read from (each failed walk's own folder:
      # the presses, the console's tail, the screenshot).
      - name: Upload the walks
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: monkey-${{ github.run_id }}-${{ github.run_attempt }}-shard${{ matrix.shard }}
          path: |
            test-results/cause-classes
            test-results/**/monkey-walk.txt
            test-results/**/*.png
            test-results/**/error-context.md
          if-no-files-found: warn
          retention-days: 14

  report:
    name: Report · ${{ needs.plan.outputs.seed }} · ${{ needs.plan.outputs.perturb }}
    needs: [plan, walk]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - name: Download every shard's walks
        uses: actions/download-artifact@v5
        with:
          pattern: monkey-${{ github.run_id }}-${{ github.run_attempt }}-shard*
          path: monkey-results
      # THE GATE: by cause class against the committed baseline — exit 3 on an episode never cured or a NEW defect class.
      - name: The report, as a gate
        id: gate
        run: |
          node scripts/monkey-report.mjs monkey-results --against tests/e2e/monkeyBaseline.json --out monkey-report.json --gate | tee monkey-report.txt
          exit ${PIPESTATUS[0]}
      # WHAT THE PASS FOUND, in the one shape every workflow speaks — and filed: one issue per cause class.
      - name: Findings
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          CONTEXT: seed ${{ needs.plan.outputs.seed }} · perturb ${{ needs.plan.outputs.perturb }}
        run: |
          RED=""
          if [ "${{ steps.gate.outcome }}" != "success" ] || [ "${{ needs.walk.result }}" != "success" ]; then RED="--gate-red"; fi
          if [ -f monkey-report.json ]; then
            node scripts/ci/findings.mjs from-monkey monkey-report.json --source monkey --context "$CONTEXT" --failed-walks monkey-results $RED \
              --repro "gh workflow run Monkey -f seed=<seed> -f perturb=${{ needs.plan.outputs.perturb }} -f shards=1 -f only='^<table>\$'   # or on the box: TM_E2E_MONKEY=1 TM_E2E_MONKEY_SEED=<seed> TM_E2E_MONKEY_ONLY='^<table>\$' npm run e2e:remote -- <task> tests/e2e/console-monkey.spec.ts" \
              --out ci-findings.json
          else
            node scripts/ci/findings.mjs broken --source monkey --context "$CONTEXT" --what "The pass produced no report (no shard uploaded its walks)" --out ci-findings.json
          fi
          node scripts/ci/findings.mjs file ci-findings.json
      - name: Summary
        if: always()
        run: |
          {
            echo '### Monkey · seed `${{ needs.plan.outputs.seed }}` · perturb `${{ needs.plan.outputs.perturb }}`'
            echo '```'
            head -n 60 monkey-report.txt 2>/dev/null || echo 'no report'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: monkey-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            monkey-report.json
            monkey-report.txt
            ci-findings.json
          retention-days: 30
